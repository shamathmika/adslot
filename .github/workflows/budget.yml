name: budget
on:
  push:
  pull_request:

jobs:
  budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      # Runner image ships Google Chrome (H.264 + native HLS); Playwright drives it with channel: 'chrome'.
      - run: npm run media
      - run: npm run build
      - run: npm run bench -- ci
        env: { RUNS: 10 }
      - run: npm run gate -- ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: bench-results, path: bench/results/ci.json }
